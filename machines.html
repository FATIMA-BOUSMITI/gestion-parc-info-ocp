<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machines - Parc Informatique OCP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Parc Informatique OCP</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="machines.html">Machines</a></li>
                <li class="nav-item"><a class="nav-link" href="pannes.html">Pannes</a></li>
                <li class="nav-item"><a class="nav-link" href="maintenance.html">Maintenance</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="mb-4">Liste des Machines</h1>

    <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#addMachineModal">Ajouter Machine</button>

    <table class="table table-bordered table-striped" id="machines-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Service</th>
                <th>Type</th>
                <th>Rôle</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Les machines seront ajoutées via PHP ou JS -->
        </tbody>
    </table>
</div>

<!-- Modal Ajouter Machine -->
<div class="modal fade" id="addMachineModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Ajouter une machine</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="addMachineForm">
          <div class="mb-3">
            <label for="service" class="form-label">Service</label>
            <input type="text" class="form-control" id="service" required>
          </div>
          <div class="mb-3">
            <label for="type" class="form-label">Type</label>
            <input type="text" class="form-control" id="type" required>
          </div>
          <div class="mb-3">
            <label for="role" class="form-label">Rôle</label>
            <input type="text" class="form-control" id="role" required>
          </div>
          <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" id="status">
                <option>OK</option>
                <option>En panne</option>
                <option>Maintenance</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Ajouter</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
